<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Kiosco</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Control de Kiosco</h1>

        <div id="alert-box" class="alert-box">
            ⚠️ <strong>Alerta: Stock Bajo en los siguientes ítems:</strong>
            <ul id="alert-list"></ul>
        </div>

        <div class="card">
            <h2>Registrar Movimiento (Compra / Venta)</h2>
            <form id="form-movimiento">
                <select id="select-producto-mov" required>
                    <option value="">Cargando productos...</option>
                </select>
                <select id="tipo_movimiento" required>
                    <option value="Salida">Venta (Salida)</option>
                    <option value="Entrada">Compra (Entrada)</option>
                </select>
                <input type="number" id="cantidad_mov" placeholder="Cantidad" min="1" required>
                <button type="submit">Registrar Movimiento</button>
            </form>
        </div>

        <div class="card">
            <h2>Añadir Nuevo Producto</h2>
            <form id="form-producto">
                <input type="text" id="nombre" placeholder="Nombre del producto" required>
                <input type="number" step="0.01" id="precio_compra" placeholder="P. Compra" required>
                <input type="number" step="0.01" id="precio_venta" placeholder="P. Venta" required>
                <input type="number" id="stock" placeholder="Stock Inicial" required>
                <input type="number" id="stock_minimo" placeholder="Stock Mínimo" required>
                <button type="submit">Añadir Ítem</button>
            </form>
        </div>

        <div class="card">
            <h2>Inventario Actual</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio Venta</th>
                        <th>Stock</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Historial de Movimientos (Compras y Ventas)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody id="tabla-movimientos"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
